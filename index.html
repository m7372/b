<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي للقنوات والأفلام</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* شاشة تسجيل الدخول */
        #login-screen { text-align: center; margin-top: 100px; background: #1e293b; padding: 40px 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        #login-screen h1 { color: #38bdf8; margin-bottom: 30px; }
        input[type="password"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 20px; font-size: 16px; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #3b82f6; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2563eb; }
        
        /* شاشة الموقع */
        #app-screen { display: none; width: 100%; max-width: 1000px; }
        header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; }
        header h2 { margin: 0; color: #38bdf8; }
        .logout-btn { background: #ef4444; width: auto; padding: 8px 15px; font-size: 14px; }
        
        /* شبكة المحتوى */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #1e293b; border-radius: 10px; overflow: hidden; text-align: center; padding: 15px; cursor: pointer; transition: 0.2s; border: 1px solid #334155; }
        .card:hover { transform: translateY(-5px); border-color: #38bdf8; }
        .card h3 { margin: 0; font-size: 16px; color: #e2e8f0; }

        /* مشغل الفيديو */
        #player-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; flex-direction: column; }
        #video-player { width: 100%; height: 100%; object-fit: contain; }
        .close-player { position: absolute; top: 20px; right: 20px; background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; z-index: 1001; width: auto; }
        
        #loading { display: none; text-align: center; color: #38bdf8; font-size: 20px; margin-top: 50px; }
    </style>
    <!-- مكتبة تشغيل البث المباشر m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <!-- شاشة الدخول -->
    <div id="login-screen">
        <h1>مرحباً بك</h1>
        <input type="password" id="password-input" placeholder="أدخل كلمة المرور">
        <button onclick="login()">دخول</button>
    </div>

    <!-- شاشة الموقع -->
    <div id="app-screen">
        <header>
            <h2>القنوات والأفلام</h2>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </header>
        
        <div id="loading">جاري تحميل المحتوى...</div>
        <div class="grid" id="content-grid"></div>
    </div>

    <!-- مشغل الفيديو -->
    <div id="player-container">
        <button class="close-player" onclick="closePlayer()">إغلاق ✕</button>
        <video id="video-player" controls autoplay></video>
    </div>

    <script>
        // ضع رابط الـ Worker الخاص بك هنا 👇
        const WORKER_URL = "https://b.m737217130.workers.dev";

        // دالة تسجيل الدخول
        async function login() {
            const pass = document.getElementById('password-input').value;
            const btn = document.querySelector('#login-screen button');
            btn.innerText = "جاري التحقق...";

            try {
                const res = await fetch(`${WORKER_URL}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password: pass }),
                    credentials: "include" // تمت الإضافة هنا
                });

                if (res.ok) {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'block';
                    loadCategories();
                } else {
                    alert("كلمة المرور غير صحيحة!");
                    btn.innerText = "دخول";
                }
            } catch (e) {
                alert("خطأ في الاتصال بالسيرفر.");
                btn.innerText = "دخول";
            }
        }

        // دالة تسجيل الخروج
        async function logout() {
            await fetch(`${WORKER_URL}/auth/logout`, { method: "POST", credentials: "include" });
            location.reload();
        }

        // جلب التصنيفات (القنوات المباشرة كمثال)
        async function loadCategories() {
            document.getElementById('loading').style.display = 'block';
            const grid = document.getElementById('content-grid');
            grid.innerHTML = '';

            try {
                const res = await fetch(`${WORKER_URL}/api/player_api.php?action=get_live_categories`, {
                    credentials: "include" // تمت الإضافة هنا
                });
                const categories = await res.json();
                
                document.getElementById('loading').style.display = 'none';

                if (Array.isArray(categories)) {
                    categories.forEach(cat => {
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = `<h3>${cat.category_name}</h3>`;
                        div.onclick = () => loadStreams(cat.category_id);
                        grid.appendChild(div);
                    });
                }
            } catch (e) {
                document.getElementById('loading').innerText = "حدث خطأ في جلب البيانات.";
            }
        }

        // جلب القنوات داخل تصنيف معين
        async function loadStreams(categoryId) {
            document.getElementById('loading').style.display = 'block';
            const grid = document.getElementById('content-grid');
            grid.innerHTML = '';

            try {
                const res = await fetch(`${WORKER_URL}/api/player_api.php?action=get_live_streams&category_id=${categoryId}`, {
                    credentials: "include" // تمت الإضافة هنا
                });
                const streams = await res.json();

                document.getElementById('loading').style.display = 'none';

                if (Array.isArray(streams)) {
                    streams.forEach(stream => {
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = `<h3>${stream.name}</h3>`;
                        // تشغيل القناة عند الضغط
                        div.onclick = () => playStream(stream.stream_id);
                        grid.appendChild(div);
                    });
                }
            } catch (e) {
                document.getElementById('loading').innerText = "حدث خطأ في جلب القنوات.";
            }
        }

        // تشغيل القناة
        function playStream(streamId) {
            const video = document.getElementById('video-player');
            const container = document.getElementById('player-container');
            container.style.display = 'flex';

            // رابط القناة المباشرة (m3u8)
            const streamUrl = `${WORKER_URL}/api/live/${streamId}.m3u8`;

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // للآيفون والسفاري
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        // إغلاق المشغل
        function closePlayer() {
            const video = document.getElementById('video-player');
            video.pause();
            video.src = "";
            document.getElementById('player-container').style.display = 'none';
        }
    </script>
</body>
</html>
