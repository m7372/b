<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>القنوات</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>body{background:#121212;color:#fff;font-family:sans-serif;padding:15px;text-align:center}.card{background:#222;padding:15px;margin:10px;border-radius:8px;cursor:pointer}.card:hover{background:#333}#player{display:none;width:100%;height:300px;background:#000;margin-bottom:10px}</style>
</head>
<body>
<h2>القنوات المباشرة</h2>
<video id="player" controls autoplay></video>
<div id="list">جاري التحميل...</div>

<script>
const WORKER = "https://b.m737217130.workers.dev";
const PASS = "اكتب_كلمة_المرور_هنا"; // ضع كلمة المرور الخاصة بك (APP_PASSWORD)

async function load() {
  try {
    let res = await fetch(`${WORKER}/api/player_api.php?action=get_live_categories`);
    let cats = await res.json();
    let html = "";
    cats.forEach(c => { html += `<div class="card" onclick="streams('${c.category_id}')">${c.category_name}</div>`; });
    document.getElementById('list').innerHTML = html;
  } catch(e) { document.getElementById('list').innerText = "خطأ في التحميل"; }
}

async function streams(id) {
  let res = await fetch(`${WORKER}/api/player_api.php?action=get_live_streams&category_id=${id}`);
  let streams = await res.json();
  let html = `<div class="card" onclick="load()">🔙 رجوع للتصنيفات</div>`;
  streams.forEach(s => { html += `<div class="card" onclick="play('${s.stream_id}')">${s.name}</div>`; });
  document.getElementById('list').innerHTML = html;
}

function play(id) {
  const video = document.getElementById('player');
  video.style.display = 'block';
  const url = `${WORKER}/api/live/${id}.m3u8`;
  if (Hls.isSupported()) {
    const hls = new Hls(); hls.loadSource(url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
  } else { video.src = url; video.play(); }
}
load();
</script>
</body>
</html>
